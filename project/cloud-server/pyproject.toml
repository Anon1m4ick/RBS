[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblak-cloud-server"
version = "0.1.0"
description = "FastAPI upload and verification server for the Oblak serverless platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[project.scripts]
oblak-cloud-server = "oblak_server.main:run"
oblak-cloud-create-user = "oblak_server.cli:create_user_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oblak_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
