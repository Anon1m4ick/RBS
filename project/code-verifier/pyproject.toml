[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblak-code-verifier"
version = "0.1.0"
description = "Security verification module for the Oblak serverless platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit==1.8.3",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
