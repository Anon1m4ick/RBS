[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblak-cdk-cli"
version = "0.1.0"
description = "CLI tool for deploying functions to the Oblak serverless platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.8",
    "requests==2.32.3",
    "rich==13.9.4",
]

[project.scripts]
cdk = "cdk.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdk*"]
